[package]
authors = [
  "nathanielsimard <nathaniel.simard.42@gmail.com>",
  "Dilshod Tadjibaev (@antimora)",
]
edition.workspace = true
license.workspace = true
name = "burn-no-std-tests"
readme = "README.md"
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-no-std-tests"
version.workspace = true

[lints]
workspace = true

[features]
default = []

[dependencies]

# ** Please make sure all dependencies support no_std **

burn = { workspace = true, features = ["flex"] }
# `buffer-allocator`, `microgemm`: built for the embedded targets, so the features stay no_std.
burn-flex = { workspace = true, features = ["buffer-allocator", "microgemm"] }

burn-store = { workspace = true, features = ["safetensors"] }

[dev-dependencies]
# Training needs autodiff; only the host test build uses it.
burn = { workspace = true, features = ["flex", "autodiff"] }
